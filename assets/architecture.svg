<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img">
  <rect width="1100" height="540" rx="20" fill="#0b0d11"/>
  <rect x="1.25" y="1.25" width="1097.5" height="537.5" rx="19" fill="none" stroke="#2a3140" stroke-width="1.5"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="48" y="44" fill="#6ee7b7" font-size="12" font-weight="600" letter-spacing="2.4">RUNTIME</text>
    <text x="48" y="68" fill="#9aa3b2" font-size="14">Clients to gateway to services. Models sit on the queue, not in every controller.</text>

    <rect x="48" y="92" width="230" height="72" rx="12" fill="#161b24" stroke="#2d3544"/>
    <text x="163" y="122" text-anchor="middle" fill="#9aa3b2" font-size="11" letter-spacing="1.6">CLIENTS</text>
    <text x="163" y="146" text-anchor="middle" fill="#f4f7fb" font-size="16" font-weight="600">Web / Mobile</text>

    <rect x="318" y="92" width="230" height="72" rx="12" fill="#161b24" stroke="#2d3544"/>
    <text x="433" y="122" text-anchor="middle" fill="#9aa3b2" font-size="11" letter-spacing="1.6">EDGE</text>
    <text x="433" y="146" text-anchor="middle" fill="#f4f7fb" font-size="16" font-weight="600">Gateway / BFF</text>

    <path d="M278 128H318" stroke="#6ee7b7" stroke-width="2"/>
    <path d="M310 122L318 128L310 134" fill="none" stroke="#6ee7b7" stroke-width="2"/>

    <rect x="588" y="76" width="200" height="48" rx="10" fill="#161b24" stroke="#2d3544"/>
    <text x="688" y="106" text-anchor="middle" fill="#f4f7fb" font-size="14" font-weight="600">IAM</text>

    <rect x="588" y="134" width="200" height="48" rx="10" fill="#161b24" stroke="#2d3544"/>
    <text x="688" y="164" text-anchor="middle" fill="#f4f7fb" font-size="14" font-weight="600">Domain services</text>

    <rect x="588" y="192" width="200" height="56" rx="10" fill="#12201c" stroke="#2f5a4a"/>
    <text x="688" y="216" text-anchor="middle" fill="#f4f7fb" font-size="14" font-weight="600">Workers</text>
    <text x="688" y="236" text-anchor="middle" fill="#9aa3b2" font-size="11">jobs / notify / LLM</text>

    <path d="M548 128H588" stroke="#6ee7b7" stroke-width="2"/>
    <path d="M580 122L588 128L580 134" fill="none" stroke="#6ee7b7" stroke-width="2"/>
    <path d="M568 128V220H588" fill="none" stroke="#2d3544" stroke-width="2"/>

    <rect x="828" y="124" width="224" height="88" rx="12" fill="#161b24" stroke="#2d3544"/>
    <text x="940" y="160" text-anchor="middle" fill="#9aa3b2" font-size="11" letter-spacing="1.6">DATA</text>
    <text x="940" y="186" text-anchor="middle" fill="#f4f7fb" font-size="16" font-weight="600">SQL / Document</text>

    <path d="M788 168H828" stroke="#6ee7b7" stroke-width="2"/>
    <path d="M820 162L828 168L820 174" fill="none" stroke="#6ee7b7" stroke-width="2"/>

    <text x="48" y="300" fill="#6ee7b7" font-size="12" font-weight="600" letter-spacing="2.4">DELIVERY</text>
    <text x="48" y="324" fill="#9aa3b2" font-size="14">PR checks, then promote. Recette before prod. Secrets stay out of git.</text>

    <rect x="48" y="348" width="168" height="64" rx="12" fill="#161b24" stroke="#2d3544"/>
    <text x="132" y="376" text-anchor="middle" fill="#9aa3b2" font-size="11" letter-spacing="1.6">PR</text>
    <text x="132" y="398" text-anchor="middle" fill="#f4f7fb" font-size="14" font-weight="600">lint / tests</text>

    <rect x="256" y="348" width="168" height="64" rx="12" fill="#161b24" stroke="#2d3544"/>
    <text x="340" y="376" text-anchor="middle" fill="#9aa3b2" font-size="11" letter-spacing="1.6">CI</text>
    <text x="340" y="398" text-anchor="middle" fill="#f4f7fb" font-size="14" font-weight="600">E2E / build</text>

    <rect x="464" y="348" width="168" height="64" rx="12" fill="#161b24" stroke="#2d3544"/>
    <text x="548" y="376" text-anchor="middle" fill="#9aa3b2" font-size="11" letter-spacing="1.6">IMAGE</text>
    <text x="548" y="398" text-anchor="middle" fill="#f4f7fb" font-size="14" font-weight="600">Docker</text>

    <rect x="672" y="348" width="168" height="64" rx="12" fill="#161b24" stroke="#2d3544"/>
    <text x="756" y="376" text-anchor="middle" fill="#9aa3b2" font-size="11" letter-spacing="1.6">RECETTE</text>
    <text x="756" y="398" text-anchor="middle" fill="#f4f7fb" font-size="14" font-weight="600">gated promote</text>

    <rect x="880" y="348" width="172" height="64" rx="12" fill="#12201c" stroke="#2f5a4a"/>
    <text x="966" y="376" text-anchor="middle" fill="#9aa3b2" font-size="11" letter-spacing="1.6">PROD</text>
    <text x="966" y="398" text-anchor="middle" fill="#f4f7fb" font-size="14" font-weight="600">web / API / mobile</text>

    <path d="M216 380H256" stroke="#6ee7b7" stroke-width="2"/>
    <path d="M248 374L256 380L248 386" fill="none" stroke="#6ee7b7" stroke-width="2"/>
    <path d="M424 380H464" stroke="#6ee7b7" stroke-width="2"/>
    <path d="M456 374L464 380L456 386" fill="none" stroke="#6ee7b7" stroke-width="2"/>
    <path d="M632 380H672" stroke="#6ee7b7" stroke-width="2"/>
    <path d="M664 374L672 380L664 386" fill="none" stroke="#6ee7b7" stroke-width="2"/>
    <path d="M840 380H880" stroke="#6ee7b7" stroke-width="2"/>
    <path d="M872 374L880 380L872 386" fill="none" stroke="#6ee7b7" stroke-width="2"/>

    <text x="48" y="460" fill="#6ee7b7" font-size="12" font-weight="600" letter-spacing="2.4">PRINCIPLES</text>
    <text x="48" y="488" fill="#d5dbe6" font-size="15">The gateway authenticates. Domain stays internal. The model is a worker with timeouts and fallbacks.</text>
    <text x="48" y="514" fill="#d5dbe6" font-size="15">Nothing ships laptop-to-prod. Recette sees the same image that prod will run.</text>
  </g>
</svg>
